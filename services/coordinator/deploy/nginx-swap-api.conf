# https vhost for the coordinator API. Put the cert on with certbot as for sovxus.org.
# The browser (https) talks only to this; it proxies to the local coordinator on :8790.
server {
    listen 443 ssl;
    server_name swap-api.sovxus.org;

    # ssl_certificate / ssl_certificate_key added by certbot

    # modest rate limit so the public SOV-RPC passthrough can't be abused
    location /api/ {
        proxy_pass http://127.0.0.1:8790;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
